name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Clean Public Folder
        run: rm -rf public

      - name: Copy files
        run: |
          mkdir -p public
          cp -r resources public

      - name: Obfuscate All JavaScript Files
        run: |
          find resources/js -name "*.js" | while read file; do
            output="public/${file#resources/}"

            mkdir -p "$(dirname "$output")"

            npx javascript-obfuscator "$file" \
              --output "$output" \
              --compact true \
              --control-flow-flattening true \
              --self-defending true
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4