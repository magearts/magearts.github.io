name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Clean Public Folder
        run: rm -rf public/*

      - name: Create Public Structure
        run: |
          mkdir -p public/css
          mkdir -p public/js

      - name: Copy HTML
        run: cp resources/index.html public/

      - name: Copy CSS
        run: cp resources/css/style.css public/css/

      - name: Obfuscate JavaScript
        run: |
          npx javascript-obfuscator resources/js/script.js \
          --output public/js/script.js \
          --compact true \
          --control-flow-flattening true \
          --self-defending true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4